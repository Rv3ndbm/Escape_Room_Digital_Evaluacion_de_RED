<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Océano -->
  <circle cx="100" cy="100" r="90" fill="url(#oceanGrad)" />
  <!-- Continentes estilizados infantiles -->
  <path d="M 45 75 Q 60 50 90 60 Q 120 70 115 100 Q 100 125 75 120 Q 40 110 45 75 Z" fill="url(#landGrad)" opacity="0.9" />
  <path d="M 125 110 Q 150 95 165 115 Q 160 145 135 140 Q 115 130 125 110 Z" fill="url(#landGrad)" opacity="0.9" />
  <path d="M 95 140 Q 115 135 120 155 Q 105 170 85 160 Z" fill="url(#landGrad)" opacity="0.9" />
  <!-- Ojos y sonrisa tierna infantil -->
  <circle cx="80" cy="95" r="7" fill="#0F172A" />
  <circle cx="120" cy="95" r="7" fill="#0F172A" />
  <circle cx="82" cy="93" r="2.5" fill="#FFFFFF" />
  <circle cx="122" cy="93" r="2.5" fill="#FFFFFF" />
  <!-- Mejillas sonrosadas -->
  <circle cx="70" cy="106" r="8" fill="#FCA5A5" opacity="0.6" />
  <circle cx="130" cy="106" r="8" fill="#FCA5A5" opacity="0.6" />
  <!-- Sonrisa -->
  <path d="M 88 108 Q 100 122 112 108" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <!-- Brillo de la atmósfera -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.25" />
</svg>
