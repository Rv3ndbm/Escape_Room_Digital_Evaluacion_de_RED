<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="100%" height="100%">
  <!-- Cuerpo semicircular amarillo del transportador -->
  <path d="M 10 120 A 110 110 0 0 1 230 120 Z" fill="#FBBF24" stroke="#D97706" stroke-width="4" opacity="0.92" />
  <!-- Arco interior hueco -->
  <path d="M 50 120 A 70 70 0 0 1 190 120 Z" fill="#F8F5ED" stroke="#D97706" stroke-width="3" />
  <!-- Línea base y centro -->
  <line x1="10" y1="120" x2="230" y2="120" stroke="#B45309" stroke-width="4" />
  <circle cx="120" cy="120" r="4" fill="#B45309" />
  <!-- Rayas de grados radiales -->
  <!-- 0 / 180 -->
  <line x1="10" y1="120" x2="25" y2="120" stroke="#92400E" stroke-width="2" />
  <line x1="215" y1="120" x2="230" y2="120" stroke="#92400E" stroke-width="2" />
  <!-- 30 / 150 -->
  <line x1="25" y1="65" x2="38" y2="72" stroke="#92400E" stroke-width="2" />
  <line x1="215" y1="65" x2="202" y2="72" stroke="#92400E" stroke-width="2" />
  <!-- 45 / 135 -->
  <line x1="42" y1="42" x2="53" y2="53" stroke="#92400E" stroke-width="2.5" />
  <line x1="198" y1="42" x2="187" y2="53" stroke="#92400E" stroke-width="2.5" />
  <!-- 60 / 120 -->
  <line x1="65" y1="25" x2="72" y2="38" stroke="#92400E" stroke-width="2" />
  <line x1="175" y1="25" x2="168" y2="38" stroke="#92400E" stroke-width="2" />
  <!-- 90 grados -->
  <line x1="120" y1="10" x2="120" y2="28" stroke="#92400E" stroke-width="3" />
  <!-- Rayas intermedias decorativas -->
  <line x1="88" y1="14" x2="92" y2="24" stroke="#92400E" stroke-width="1.5" />
  <line x1="152" y1="14" x2="148" y2="24" stroke="#92400E" stroke-width="1.5" />
  <!-- Rayas interiores de grados -->
  <line x1="120" y1="50" x2="120" y2="120" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="70" y1="70" x2="120" y2="120" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="170" y1="70" x2="120" y2="120" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>
