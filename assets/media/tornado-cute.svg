  <ellipse cx="75" cy="54" rx="46" ry="14" fill="#60A5FA" stroke="#2563EB" stroke-width="3" />
  <ellipse cx="75" cy="80" rx="36" ry="12" fill="#3B82F6" stroke="#1D4ED8" stroke-width="3" />
  <ellipse cx="75" cy="105" rx="26" ry="10" fill="#2563EB" stroke="#1E40AF" stroke-width="3" />
  <ellipse cx="75" cy="128" rx="16" ry="7" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="3" />
  <circle cx="75" cy="145" r="7" fill="#1E40AF" />
  <!-- Ojos mareados / divertidos en la capa intermedia -->
  <circle cx="65" cy="52" r="6" fill="#FFFFFF" />
  <circle cx="85" cy="52" r="6" fill="#FFFFFF" />
