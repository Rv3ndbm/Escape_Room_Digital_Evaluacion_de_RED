  <circle cx="94" cy="58" r="4" fill="#F472B6" />
  <!-- Sonrisa abierta traviesa -->
  <path d="M 70 58 Q 75 66 80 58 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5" />
  <!-- Vientito girando alrededor -->
  <path d="M 20 40 Q 15 20 40 18" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
  <path d="M 130 90 Q 140 110 120 115" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
