<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Rayos dorados -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Rayos giratorios suaves -->
  <g stroke="#FBBF24" stroke-width="6" stroke-linecap="round">
    <line x1="80" y1="12" x2="80" y2="26" />
    <line x1="80" y1="134" x2="80" y2="148" />
    <line x1="12" y1="80" x2="26" y2="80" />
    <line x1="134" y1="80" x2="148" y2="80" />
    <line x1="32" y1="32" x2="42" y2="42" />
    <line x1="118" y1="118" x2="128" y2="128" />
    <line x1="32" y1="128" x2="42" y2="118" />
    <line x1="118" y1="42" x2="128" y2="32" />
  </g>
  <!-- Cara redonda del sol -->
  <circle cx="80" cy="80" r="46" fill="url(#sunGrad)" stroke="#D97706" stroke-width="3" />
  <!-- Gafas de sol negras geniales -->
  <path d="M 46 66 Q 60 64 74 66 L 72 82 Q 58 84 48 80 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
  <path d="M 86 66 Q 100 64 114 66 L 112 80 Q 102 84 88 82 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
  <!-- Puente de las gafas -->
  <line x1="74" y1="70" x2="86" y2="70" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <!-- Patillas de las gafas -->
  <line x1="46" y1="68" x2="36" y2="72" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <line x1="114" y1="68" x2="124" y2="72" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <!-- Reflejo blanco en las gafas -->
  <line x1="52" y1="70" x2="60" y2="78" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="92" y1="70" x2="100" y2="78" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <!-- Mejillas sonrojadas -->
  <circle cx="50" cy="94" r="6" fill="#FB7185" opacity="0.7" />
  <circle cx="110" cy="94" r="6" fill="#FB7185" opacity="0.7" />
  <!-- Sonrisa pícara -->
  <path d="M 68 96 Q 80 108 92 96" fill="none" stroke="#78350F" stroke-width="3.5" stroke-linecap="round" />
</svg>
