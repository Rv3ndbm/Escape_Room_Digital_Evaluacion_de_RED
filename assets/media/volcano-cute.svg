<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente del cielo / resplandor -->
    <radialGradient id="volcanoGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <!-- Gradiente de lava ardiente -->
    <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <!-- Gradiente de la montaña -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#3B1C0B"/>
    </linearGradient>
    <!-- Sombra suave -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Resplandor cálido de erupción -->
  <circle cx="100" cy="55" r="55" fill="url(#volcanoGlow)"/>

  <!-- Nubes de humo esponjosas y chispas -->
  <g filter="url(#softShadow)">
    <circle cx="100" cy="36" r="22" fill="#FCE7F3" opacity="0.95"/>
    <circle cx="76" cy="30" r="17" fill="#FBCFE8" opacity="0.95"/>
    <circle cx="124" cy="28" r="18" fill="#F472B6" opacity="0.9"/>
    <circle cx="98" cy="18" r="14" fill="#FFFFFF"/>
    <!-- Chispitas doradas -->
    <circle cx="68" cy="14" r="3.5" fill="#FBBF24"/>
    <circle cx="132" cy="12" r="3" fill="#F59E0B"/>
    <circle cx="85" cy="8" r="2.5" fill="#EF4444"/>
    <circle cx="115" cy="8" r="3" fill="#FBBF24"/>
  </g>

  <!-- Cuerpo de la montaña volcánica -->
  <g filter="url(#softShadow)">
    <path d="M 80 62 L 20 180 C 60 188 140 188 180 180 L 120 62 Z" fill="#6B3311" stroke="#3D1A04" stroke-width="3"/>
    <!-- Lado sombreado para dar volumen 3D -->
    <path d="M 100 62 L 100 184 C 135 186 165 183 180 180 L 120 62 Z" fill="#451A03" opacity="0.35"/>
    
    <!-- Cráter superior ardiente -->
    <ellipse cx="100" cy="62" rx="22" ry="7" fill="#1C0A00" stroke="#DC2626" stroke-width="2"/>
    <ellipse cx="100" cy="62" rx="17" ry="5" fill="url(#lavaGrad)"/>
    
    <!-- Ríos de lava dorada y roja que caen por las laderas -->
    <path d="M 94 66 Q 90 95 97 120 Q 92 145 88 178" fill="none" stroke="url(#lavaGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 108 66 Q 114 90 109 115 Q 115 140 120 178" fill="none" stroke="url(#lavaGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 101 67 Q 102 100 101 130" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Carita tierna infantil en la montaña -->
  <g>
    <!-- Ojos grandes kawaii con reflejo brillante -->
    <circle cx="82" cy="132" r="6.5" fill="#1E120B"/>
    <circle cx="118" cy="132" r="6.5" fill="#1E120B"/>
    <circle cx="80" cy="130" r="2.2" fill="#FFFFFF"/>
    <circle cx="116" cy="130" r="2.2" fill="#FFFFFF"/>
    <circle cx="83.5" cy="134" r="1" fill="#FFFFFF"/>
    <circle cx="119.5" cy="134" r="1" fill="#FFFFFF"/>
    <!-- Mejillas sonrojadas de calor -->
    <circle cx="72" cy="141" r="6.5" fill="#F43F5E" opacity="0.75"/>
    <circle cx="128" cy="141" r="6.5" fill="#F43F5E" opacity="0.75"/>
    <!-- Sonrisa dulce -->
    <path d="M 93 140 Q 100 148 107 140" fill="none" stroke="#1E120B" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
