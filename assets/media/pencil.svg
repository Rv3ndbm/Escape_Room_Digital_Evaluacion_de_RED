<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" width="100%" height="100%">
  <!-- Goma Rosa -->
  <rect x="0" y="5" width="45" height="30" rx="6" fill="#F472B6" />
  <path d="M 5 5 L 45 5 L 45 35 L 5 35 Z" fill="#EC4899" opacity="0.2" />
  <!-- Virola Dorada / Metálica -->
  <rect x="45" y="5" width="22" height="30" fill="#FBBF24" />
  <line x1="52" y1="5" x2="52" y2="35" stroke="#D97706" stroke-width="2" />
  <line x1="60" y1="5" x2="60" y2="35" stroke="#D97706" stroke-width="2" />
  <!-- Cuerpo Azul del Lápiz -->
  <rect x="67" y="5" width="250" height="30" fill="#3B82F6" />
  <!-- Líneas facetadas del lápiz -->
  <line x1="67" y1="15" x2="317" y2="15" stroke="#2563EB" stroke-width="3" />
  <line x1="67" y1="25" x2="317" y2="25" stroke="#1D4ED8" stroke-width="3" />
  <!-- Madera Afilada -->
  <polygon points="317,5 317,35 375,20" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" />
  <!-- Mina de Grafito -->
  <polygon points="360,16 360,24 385,20" fill="#1E293B" />
</svg>
